  <style>
    text {
      font-family: monospace;
    }

    .tech-label {
      fill: #e5ffed;
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }

    .icon {
      fill: #39ff7b;
      font-size: 32px;
      font-weight: 700;
      text-anchor: middle;
    }

    .month {
      fill: #8cb99a;
      font-size: 11px;
    }

    .marquee {
      animation: scroll 30s linear infinite;
    }

    @keyframes scroll {
      from { transform: translateX(0); }
      to { transform: translateX(-952px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .marquee {
        animation: none;
      }
    }
  </style>

  

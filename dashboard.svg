<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc">
  <title id="title">Akashdeep — Tech Stack and Contributions</title>
  <desc id="desc">Scrolling Java, C, HTML, CSS, JavaScript, React and Python. GitHub contribution snapshot captured on 14 November 2026.</desc>

  <defs>
    <linearGradient id="cardGradient" x2="1" y2="1">
      <stop stop-color="#0a2114"/>
      <stop offset="1" stop-color="#050e09"/>
    </linearGradient>

    <clipPath id="stackWindow">
      <rect x="32" y="58" width="936" height="76" rx="11"/>
    </clipPath>

    <!-- Shared card background -->
    <g id="card">
      <rect width="120" height="76" rx="11"
        fill="url(#cardGradient)" stroke="#245436"/>
    </g>

    <!-- Java icon -->
    <g id="javaIcon" fill="none" stroke="#39ff7b"
      stroke-width="2.7" stroke-linecap="round">
      <path d="M-20-6H16V5Q16 18-2 18Q-20 18-20 5Z"/>
      <path d="M16-3H23Q31-3 29 5Q27 12 17 12"/>
      <path d="M-25 25H23"/>
      <path d="M-11-15C-23-26 4-25-4-38"/>
      <path d="M3-15C-8-25 17-27 10-40"/>
    </g>

    <!-- React icon -->
    <g id="reactIcon" fill="none" stroke="#39ff7b" stroke-width="2.4">
      <ellipse rx="30" ry="11"/>
      <ellipse rx="30" ry="11" transform="rotate(60)"/>
      <ellipse rx="30" ry="11" transform="rotate(120)"/>
      <circle r="4" fill="#39ff7b" stroke="none"/>
    </g>

    <!-- One complete row; duplicated for seamless scrolling -->
    <g id="techStack">

      <g transform="translate(0 0)">
        <use href="#card"/>
        <use href="#javaIcon" transform="translate(60 28) scale(.48)"/>
        <text x="60" y="64" class="tech-label">Java</text>
      </g>

      <g transform="translate(136 0)">
        <use href="#card"/>
        <text x="60" y="38" class="icon">C</text>
        <text x="60" y="64" class="tech-label">C</text>
      </g>

      <g transform="translate(272 0)">
        <use href="#card"/>
        <text x="60" y="36" class="icon">&lt;/&gt;</text>
        <text x="60" y="64" class="tech-label">HTML</text>
      </g>

      <g transform="translate(408 0)">
        <use href="#card"/>
        <text x="60" y="39" class="icon">#</text>
        <text x="60" y="64" class="tech-label">CSS</text>
      </g>

      <g transform="translate(544 0)">
        <use href="#card"/>
        <rect x="45" y="13" width="30" height="30" rx="4" fill="#39ff7b"/>
        <text x="60" y="35" fill="#030b07" font-size="19"
          font-weight="700" text-anchor="middle">JS</text>
        <text x="60" y="64" class="tech-label">JavaScript</text>
      </g>

      <g transform="translate(680 0)">
        <use href="#card"/>
        <use href="#reactIcon" transform="translate(60 28) scale(.58)"/>
        <text x="60" y="64" class="tech-label">React</text>
      </g>

      <g transform="translate(816 0)">
        <use href="#card"/>
        <text x="60" y="37" class="icon">Py</text>
        <text x="60" y="64" class="tech-label">Python</text>
      </g>

    </g>

    <!-- Empty contribution squares -->
    <pattern id="contributionGrid"
      x="70" y="211" width="17" height="11"
      patternUnits="userSpaceOnUse">
      <rect width="13" height="8" rx="2" fill="#0d2115"/>
    </pattern>
  </defs>

  <style>
    text {
      font-family: monospace;
    }

    .tech-label {
      fill: #e5ffed;
      font-size: 16px;
      font-weight: 600;
      text-anchor: middle;
    }

    .icon {
      fill: #39ff7b;
      font-size: 32px;
      font-weight: 700;
      text-anchor: middle;
    }

    .month {
      fill: #8cb99a;
      font-size: 11px;
    }

    .marquee {
      animation: scroll 30s linear infinite;
    }

    @keyframes scroll {
      from { transform: translateX(0); }
      to { transform: translateX(-952px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .marquee {
        animation: none;
      }
    }
  </style>

  <!-- Main panel -->
  <rect x=".5" y=".5" width="999" height="319" rx="16"
    fill="#030b07" stroke="#245436"/>

  <!-- Tech stack heading -->
  <text x="32" y="35" fill="#39ff7b" font-size="17" font-weight="700">
    // TECH STACK
  </text>

  <text x="968" y="35" fill="#81aa8d" font-size="12" text-anchor="end">
    7 TOOLS / ALWAYS BUILDING
  </text>

  <!-- Animated horizontal row -->
  <g clip-path="url(#stackWindow)">
    <g transform="translate(32 58)">
      <g class="marquee">
        <use href="#techStack"/>
        <use href="#techStack" x="952"/>
      </g>
    </g>
  </g>

  <path d="M32 151H968" stroke="#193f28"/>

  <!-- Contributions heading -->
  <text x="32" y="176" fill="#39ff7b" font-size="17" font-weight="700">
    // GITHUB CONTRIBUTIONS
  </text>

  <text x="968" y="176" fill="#b1d8bc" font-size="13" text-anchor="end">
    5 contributions in the past year
  </text>

  <!-- Month labels -->
  <g class="month">
    <text x="70" y="198">Nov</text>
    <text x="121" y="198">Dec</text>
    <text x="189" y="198">Jan</text>
    <text x="274" y="198">Feb</text>
    <text x="342" y="198">Mar</text>
    <text x="410" y="198">Apr</text>
    <text x="478" y="198">May</text>
    <text x="563" y="198">Jun</text>
    <text x="631" y="198">Jul</text>
    <text x="699" y="198">Aug</text>
    <text x="784" y="198">Sep</text>
    <text x="852" y="198">Oct</text>
  </g>

  <!-- Weekday labels -->
  <g fill="#8cb99a" font-size="10">
    <text x="32" y="230">Mon</text>
    <text x="32" y="252">Wed</text>
    <text x="32" y="274">Fri</text>
  </g>

  <!-- 53-week contribution grid -->
  <rect x="70" y="211" width="897" height="74"
    fill="url(#contributionGrid)"/>

  <!-- Five contributions on 13 November 2026 -->
  <rect x="954" y="266" width="13" height="8" rx="2" fill="#39ff7b"/>

  <!-- Day beyond the fetched calendar -->
  <rect x="954" y="277" width="13" height="8" fill="#030b07"/>

  <!-- Snapshot date -->
  <text x="70" y="307" fill="#81aa8d" font-size="11">
    SNAPSHOT · 14 NOV 2026
  </text>

  <!-- Contribution legend -->
  <text x="800" y="307" fill="#81aa8d" font-size="11">Less</text>

  <rect x="838" y="298" width="13" height="9" rx="2" fill="#0d2115"/>
  <rect x="856" y="298" width="13" height="9" rx="2" fill="#12492a"/>
  <rect x="874" y="298" width="13" height="9" rx="2" fill="#197c40"/>
  <rect x="892" y="298" width="13" height="9" rx="2" fill="#28b65d"/>
  <rect x="910" y="298" width="13" height="9" rx="2" fill="#39ff7b"/>

  <text x="934" y="307" fill="#81aa8d" font-size="11">More</text>
</svg>
